<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1421"><title>LifeOS — Focus Mode Research</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;min-width:320px;background:var(--bg);color:var(--text)}
body[data-theme="dark"]{color-scheme:dark;--bg:#0a111e;--surface:#111d2c;--surface2:#172737;--sidebar:#0e1927;--border:#293a4c;--text:#f2f7fc;--muted:#9db1c4;--dim:#798fa6;--a:#45dece;--b:#6e9cff;--purple:#ad8aff;--warn:#ffbb75;--success:#45dfb6;--danger:#ff8c89;--shadow:0 18px 45px #030a1469;--hero:linear-gradient(115deg,#16324b,#152c4a)}
body[data-theme="light"]{color-scheme:light;--bg:#f4f6f4;--surface:#fff;--surface2:#ecf2ef;--sidebar:#fff;--border:#dce5df;--text:#1c3030;--muted:#5c7573;--dim:#849c98;--a:#087e70;--b:#2456ed;--purple:#7240de;--warn:#b16b00;--success:#078769;--danger:#d75346;--shadow:0 15px 33px #152e1e14;--hero:linear-gradient(115deg,#d4f3e6,#a9dfe6)}
button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}
h1,h2,h3,p{margin:0}h1,h2,h3{font-family:ui-sans-serif,system-ui,Segoe UI,sans-serif;letter-spacing:-.8px}h1{font-size:clamp(27px,3vw,44px);letter-spacing:-1.8px}h2{font-size:18px}.label{font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:2px;color:var(--dim)}.muted{color:var(--muted)}.tiny{font-size:11px}.small{font-size:12px}.bold{font-weight:800}
.top{height:62px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 clamp(16px,3vw,42px);position:sticky;top:0;z-index:20;background:var(--sidebar)}
.brand{font-size:15px;font-weight:900;display:flex;align-items:center;gap:10px;white-space:nowrap}.mark{height:30px;width:30px;background:linear-gradient(135deg,var(--a),var(--b),var(--purple));color:#fff;display:grid;place-items:center;border-radius:10px}.topactions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--border);border-radius:11px;background:var(--surface);padding:11px 14px;font-size:12px;font-weight:800;min-height:41px;transition:.15s}.btn:hover{border-color:var(--a)}.btn.primary{background:var(--a);border-color:var(--a);color:var(--bg)}body[data-theme="light"] .btn.primary{color:#fff}.btn.secondary{background:var(--surface2)}.btn.danger{color:var(--danger)}.btn.small{min-height:34px;padding:7px 10px;font-size:11px}
.shell{display:grid;grid-template-columns:minmax(265px,320px) minmax(430px,1fr) minmax(245px,320px);max-width:1800px;margin:0 auto;min-height:calc(100vh - 62px)}
.panel-left{background:var(--sidebar);border-right:1px solid var(--border);padding:25px 20px}
.panel-right{background:var(--sidebar);border-left:1px solid var(--border);padding:26px 20px}
.content{min-width:0;padding:29px clamp(22px,3.6vw,65px) 65px}
.headerline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:21px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:21px 0 11px}
.card{border:1px solid var(--border);background:var(--surface);border-radius:17px;padding:20px;box-shadow:var(--shadow)}
.card.soft{background:var(--surface2);box-shadow:none}
.hero{padding:25px 26px;background:var(--hero);border:1px solid var(--border);border-radius:19px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-55px;top:-80px;border:2px solid color-mix(in srgb,var(--a) 26%,transparent);width:215px;height:215px;border-radius:50%;box-shadow:0 0 0 30px color-mix(in srgb,var(--b) 6%,transparent),0 0 0 55px color-mix(in srgb,var(--purple) 4%,transparent)}
.hero>*{position:relative;z-index:1}
.hero h1{margin-top:10px}.hero p{line-height:1.65;font-size:13px;max-width:660px;color:var(--muted);margin-top:13px}
.hero-actions{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
.tag{font-size:10px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:6px 8px;font-weight:800;display:inline-block}
.tag.active{background:color-mix(in srgb,var(--a) 13%,var(--surface));color:var(--a);border-color:color-mix(in srgb,var(--a) 25%,var(--border))}
.progress{height:7px;background:var(--surface2);border-radius:15px;overflow:hidden;margin-top:11px}.progress i{height:100%;display:block;background:linear-gradient(90deg,var(--a),var(--b));width:var(--p);border-radius:15px}
.exercise{padding:13px;border-radius:13px;display:grid;gap:7px;background:transparent;border:1px solid transparent;margin:5px 0;text-align:left;width:100%;color:var(--text)}
.exercise:hover{background:var(--surface2)}.exercise.active{border-color:var(--a);background:color-mix(in srgb,var(--a) 9%,var(--surface))}
.exercise.done{opacity:.75}
.exercise-name{font-weight:800;font-size:12px}.exercise-detail{font-size:10px;color:var(--muted);line-height:1.6}
.dot{height:8px;width:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:4px}
.done .dot{background:var(--success)}.active .dot{background:var(--a)}.skipped .dot{background:var(--warn)}
.setdots{display:flex;gap:5px;margin-top:4px}.setdots span{width:20px;height:4px;border-radius:5px;background:var(--border)}.setdots span.done{background:var(--a)}
.big{font-family:ui-sans-serif,system-ui;font-size:clamp(31px,4vw,57px);font-weight:900;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:9px 0}.details{display:flex;gap:12px;flex-wrap:wrap}.detailbox{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}.detailbox .value{font-size:29px;font-weight:900;margin:6px 0;font-variant-numeric:tabular-nums}
.counter{display:flex;justify-content:center;align-items:center;gap:15px}
.counter button{height:39px;width:39px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);font-size:21px}
.counter strong{min-width:70px;text-align:center;font-size:25px;font-variant-numeric:tabular-nums}
.tip{border:1px solid var(--border);background:var(--surface2);border-radius:14px;padding:16px;line-height:1.65;color:var(--muted);font-size:12px}
.tip strong{color:var(--text)}
.sessionstat{border-bottom:1px solid var(--border);padding:11px 0;display:flex;justify-content:space-between;gap:12px;font-size:12px}.sessionstat:last-child{border-bottom:0}.sessionstat b{font-variant-numeric:tabular-nums}
.timer{display:grid;place-items:center;text-align:center;padding:18px 0 28px}.timer-circle{height:190px;width:190px;border-radius:50%;border:8px solid var(--border);position:relative;display:grid;place-items:center;background:conic-gradient(var(--a) var(--pct),var(--border) 0);box-shadow:0 0 0 15px color-mix(in srgb,var(--a) 5%,transparent)}
.timer-circle:before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.timer-circle .clock{position:relative;font-size:45px;font-weight:900;letter-spacing:-2px;font-variant-numeric:tabular-nums}.timer-circle small{display:block;font-size:11px;letter-spacing:0;color:var(--muted)}
.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.grow{flex:1}
.overline{border-top:1px solid var(--border);margin:25px 0}
.field{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:11px;min-width:0}
.compare{background:color-mix(in srgb,var(--a) 8%,var(--surface));border-left:3px solid var(--a);padding:12px 14px;border-radius:0 10px 10px 0;color:var(--muted);line-height:1.6;font-size:11px}
.stretch-list{display:flex;flex-direction:column;gap:10px}
.stretchlist-item{border:1px solid var(--border);border-radius:13px;padding:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);color:var(--text);width:100%;text-align:left}
.stretchlist-item.active{border-color:var(--purple)}.stretchlist-item.done{opacity:.6}
.dialog{position:fixed;inset:0;border:1px solid var(--border);border-radius:19px;background:var(--surface);color:var(--text);max-width:540px;width:calc(100% - 30px);max-height:85vh;padding:27px;box-shadow:0 30px 80px #000a}
.dialog::backdrop{background:#020811aa;backdrop-filter:blur(5px)}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:25px 0}.summary-grid>div{text-align:center;border:1px solid var(--border);border-radius:13px;padding:20px 9px;background:var(--surface2)}.summary-grid strong{display:block;font-size:24px;margin-bottom:5px}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:13px 17px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:800;font-size:12px;z-index:90;box-shadow:var(--shadow)}
details summary{cursor:pointer;color:var(--a);font-size:12px;font-weight:800;margin-bottom:10px}
.mobile-program{display:none}
@media(max-width:1300px){.shell{grid-template-columns:270px minmax(330px,1fr)}.panel-right{grid-column:1/-1;border-top:1px solid var(--border);border-left:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.panel-right>*{min-width:0}}
@media(max-width:820px){.shell{display:block}.panel-left{display:none}.panel-right{display:block;border-top:1px solid var(--border)}.content{padding:20px 17px 55px}.top{height:auto;min-height:62px;padding:10px 12px}.topactions{gap:5px}.topactions .btn{padding:9px;font-size:10px}.mobile-program{display:block;margin:0 0 15px}.mobile-program details{border-radius:13px;background:var(--surface);padding:13px;border:1px solid var(--border)}.mobile-program details>div{max-height:220px;overflow:auto}.headerline{flex-wrap:wrap}.hero{padding:20px}.details{gap:9px}.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body data-theme="dark">
<div class="top"><div class="brand"><span class="mark">◈</span>LifeOS 2.0 <span class="tag active">FitOS / Focus Research</span></div><div class="topactions"><a class="btn small" href="../batch-04/index.html#fitos" style="text-decoration:none;display:inline-flex;align-items:center">← FitOS Lab</a><button class="btn small" id="switch-mode" type="button">Stretching ⇄</button><button class="btn small" id="switch-theme" type="button">☼ Giorno</button><button class="btn small" id="reset" type="button">↺ Reset demo</button></div></div>
<div class="shell"><aside class="panel-left" aria-label="Programma completo"><div id="program-sidebar"></div></aside><main class="content"><div class="mobile-program"><details id="mobile-program"><summary>☰ Scheda completa — apri gli esercizi</summary><div id="program-mobile"></div></details></div><div id="main"></div></main><aside class="panel-right"><div id="insights"></div></aside></div>
<dialog class="dialog" id="confirmation" aria-labelledby="dlg-heading"><div id="dialog-content"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const workoutName="Upper Body A";
const catalog=[
{id:"panca",name:"Panca piana",sets:3,reps:8,weight:50,rest:120,muscles:["Petto","Tricipiti"],last:{weight:47.5,reps:8,sets:3,date:"Ultima sessione"},tip:"Piedi stabili, scapole addotte, traiettoria controllata. Mantieni i polsi allineati."},
{id:"lat",name:"Lat machine",sets:3,reps:10,weight:45,rest:90,muscles:["Dorsali","Bicipiti"],last:{weight:45,reps:10,sets:3,date:"Ultima sessione"},tip:"Evita lo slancio, abbassa le spalle e guida il movimento con i gomiti."},
{id:"press",name:"Shoulder press",sets:3,reps:12,weight:16,rest:75,muscles:["Spalle","Tricipiti"],last:{weight:14,reps:12,sets:3,date:"Ultima sessione"},tip:"Tieni il core attivo, controlla la discesa ed evita di inarcare eccessivamente la schiena."},
{id:"curl",name:"Curl manubri",sets:2,reps:12,weight:10,rest:60,muscles:["Bicipiti"],last:{weight:10,reps:10,sets:2,date:"Ultima sessione"},tip:"Gomiti vicino al busto, niente slancio; controlla tutta la fase eccentrica."},
{id:"pushdown",name:"Pushdown tricipiti",sets:3,reps:12,weight:25,rest:60,muscles:["Tricipiti"],last:{weight:22.5,reps:12,sets:3,date:"Ultima sessione"},tip:"Blocca le spalle e tieni il busto fermo; estendi i gomiti senza compensazioni."}
];
const stretching=[
{id:"hip",name:"Flessori dell'anca",duration:90,tip:"Muoviti lentamente, mantieni il respiro regolare. Non forzare in caso di dolore.",muscle:"Anca"},
{id:"back",name:"Mobilità dorsale",duration:120,tip:"Respira senza trattenere l'aria e cerca un movimento controllato, non un allungamento massimo.",muscle:"Dorso"},
{id:"posterior",name:"Catena posteriore",duration:120,tip:"Mantieni una tensione moderata, senza rimbalzi. Fermati se compaiono sintomi insoliti.",muscle:"Gambe"}
];
let theme="dark",mode=location.hash==="#stretch"?"stretch":"workout",status="ready",index=0,setIndex=0,phase="work",draft={weight:50,reps:8};
let logs={},skipped={},stretchDone={},paused=false,deadline=null,remaining=0,restLength=0,tick=null,startTime=null,elapsed=0,lastUndo=null,toastTimeout=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(n){n=Math.max(0,Math.floor(n));return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")}
function showToast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.hidden=true,3000)}
function reset(){clearInterval(tick);tick=null;status="ready";index=0;setIndex=0;phase="work";logs={};skipped={};stretchDone={};draft={weight:catalog[0].weight,reps:catalog[0].reps};paused=false;deadline=null;remaining=0;restLength=0;startTime=null;elapsed=0;lastUndo=null;render()}
function current(){return mode==="workout"?catalog[index]:stretching[index]}
function completedSets(){return Object.values(logs).reduce((acc,x)=>acc+x.length,0)}
function totalSets(){return catalog.reduce((acc,x)=>acc+x.sets,0)}
function progress(){return mode==="workout"?Math.round(completedSets()/totalSets()*100):Math.round(Object.values(stretchDone).filter(Boolean).length/stretching.length*100)}
function timeElapsed(){return startTime?Math.floor((Date.now()-startTime)/1000):elapsed}
function stopTicker(){if(tick)clearInterval(tick);tick=null}
function enterIndex(next){if(mode==="workout"&&(logs[catalog[next]?.id]||[]).length>=catalog[next]?.sets)return;index=next;const x=current();setIndex=mode==="workout"?(logs[x.id]||[]).length:0;draft={weight:x.weight||0,reps:x.reps||0};phase="work";paused=false;deadline=null;remaining=0;stopTicker();render()}
function start(){if(status==="ready"){status="running";startTime=Date.now();enterIndex(0)}}
function beginTimer(seconds){phase="rest";restLength=Math.max(1,seconds);remaining=seconds;paused=false;deadline=Date.now()+seconds*1000;stopTicker();tick=setInterval(updateTime,160);render()}
function updateTime(){if(status!=="running"||paused||phase!=="rest")return;remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));const el=$("#time-display");if(el)el.textContent=fmt(remaining);const circle=$("#time-circle");if(circle)circle.style.setProperty("--pct",Math.max(0,remaining/restLength*100)+"%");if(remaining<=0){stopTicker();mode==="stretch"?completeStretch():completeRest()}}
function completeRest(){phase="work";setIndex++;remaining=0;deadline=null;paused=false;render();showToast("Recupero terminato. Puoi iniziare la prossima serie.")}
function pause(){if(phase!=="rest")return;if(!paused){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));paused=true;deadline=null}else{paused=false;deadline=Date.now()+remaining*1000}render()}
function adjustRest(seconds){if(phase!=="rest")return;remaining=Math.max(0,remaining+seconds);if(!paused)deadline=Date.now()+remaining*1000;if(remaining<=0){stopTicker();completeRest();return}render()}
function logSet(){if(status!=="running"||mode!=="workout"||phase!=="work")return;const x=current();const entry={weight:Math.max(0,draft.weight),reps:Math.max(0,draft.reps),at:new Date().toISOString(),index:setIndex+1};logs[x.id]??=[];logs[x.id].push(entry);lastUndo={exercise:index,entry};if(logs[x.id].length===x.sets){advanceExercise()}else beginTimer(x.rest)}
function advanceExercise(){stopTicker();let next=index+1;while(next<catalog.length&&(skipped[catalog[next].id]||(logs[catalog[next].id]||[]).length>=catalog[next].sets))next++;if(next>=catalog.length){next=catalog.findIndex(x=>!skipped[x.id]&&(logs[x.id]||[]).length<x.sets)}if(next<0||next>=catalog.length){finish();return}enterIndex(next)}
function skipEx(){if(mode!=="workout")return;skipped[current().id]=true;lastUndo=null;advanceExercise()}
function undoSet(){if(mode!=="workout"||!lastUndo)return;const u=lastUndo;if(!logs[catalog[u.exercise].id]?.length)return;stopTicker();logs[catalog[u.exercise].id].pop();index=u.exercise;setIndex=logs[catalog[u.exercise].id].length;phase="work";draft={weight:u.entry.weight,reps:u.entry.reps};remaining=0;deadline=null;paused=false;status="running";lastUndo=null;render();showToast("Ultima serie annullata")}
function finish(){stopTicker();status="finished";phase="finished";elapsed=timeElapsed();render()}
function startStretchTimer(){if(status!=="running"||mode!=="stretch"||phase!=="work")return;beginTimer(current().duration)}
function completeStretch(){if(status!=="running"||mode!=="stretch")return;stopTicker();stretchDone[current().id]=true;let next=index+1;if(next>=stretching.length){finish();return}enterIndex(next)}
function skipStretch(){if(mode!=="stretch")return;stopTicker();let next=index+1;if(next>=stretching.length){finish();return}enterIndex(next)}
function heading(label,title,sub){return '<div class="label">'+label+'</div><h1 style="margin:9px 0">'+title+'</h1><p class="muted" style="font-size:12px;line-height:1.7">'+sub+'</p>'}
function programHtml(){const list=mode==="workout"?catalog:stretching;
 let h='<div class="headerline"><div><div class="label">SCHEDA COMPLETA</div><h2 style="margin-top:9px">'+(mode==="workout"?workoutName:"Mobilità serale")+'</h2></div><span class="tag active">'+progress()+'%</span></div><div class="progress" style="--p:'+progress()+'%"><i></i></div><div class="tiny muted" style="margin:13px 0">Tutti gli esercizi visibili in ogni momento.</div>';
 for(let i=0;i<list.length;i++){const x=list[i],cnt=(logs[x.id]||[]).length,done=mode==="workout"?cnt===x.sets:stretchDone[x.id],skip=skipped[x.id],active=status==="running"&&i===index;
 h+='<button class="exercise '+(active?"active ":"")+(done?"done ":"")+(skip?"skipped ":"")+'" data-select="'+i+'" '+(status!=="running"||mode==="stretch"||done||skip?'disabled':'')+'><div class="exercise-name"><span class="dot"></span>'+esc(x.name)+(done?' ✓':skip?' · saltato':'')+'</div><div class="exercise-detail">'+(mode==="workout"?x.sets+' × '+x.reps+' · '+x.weight+' kg · Riposo '+fmt(x.rest):fmt(x.duration)+' · '+x.muscle)+'</div><div class="setdots">'+(mode==="workout"?Array.from({length:x.sets},(_,k)=>'<span class="'+(k<cnt?"done":"")+'"></span>').join(""):'<span style="width:100%;'+(done?'background:var(--a)':'')+'"></span>')+'</div></button>';}
 return h;
}
function showRight(){
 const x=current(),exDone=mode==="workout"?completedSets():Object.values(stretchDone).filter(Boolean).length;
 let h='<div class="sectionhead" style="margin-top:0"><h2>Dettagli sessione</h2></div>'+
 '<div class="sessionstat"><span class="muted">Scheda</span><b>'+(mode==="workout"?workoutName:"Mobilità serale")+'</b></div>'+
 '<div class="sessionstat"><span class="muted">'+(mode==="workout"?"Serie completate":"Esercizi completati")+'</span><b>'+exDone+' / '+(mode==="workout"?totalSets():stretching.length)+'</b></div>'+
 '<div class="sessionstat"><span class="muted">Tempo trascorso</span><b>'+fmt(timeElapsed())+'</b></div>'+
 '<div class="sessionstat"><span class="muted">Esercizio</span><b>'+Math.min(index+1,mode==="workout"?catalog.length:stretching.length)+' / '+(mode==="workout"?catalog.length:stretching.length)+'</b></div>';
 if(status!=="finished"&&x){
 h+='<div class="overline"></div><div class="sectionhead"><h2>Consigli tecnici</h2></div><div class="tip"><strong>◈ '+esc(x.name)+'</strong><p style="margin:10px 0 0">'+esc(x.tip)+'</p></div>';
 if(mode==="workout"){const l=x.last;h+='<div class="sectionhead"><h2>Ultima volta</h2></div><div class="card soft"><div class="bold">'+l.weight+' kg × '+l.reps+' rip. × '+l.sets+' serie</div><p class="muted tiny" style="line-height:1.65;margin-top:10px">'+esc(l.date)+'</p></div><div class="sectionhead"><h2>Progressione</h2></div><div class="compare">'+(draft.weight>l.weight?'Carico previsto maggiore rispetto all’ultima sessione. Mantieni buona tecnica e ascolta lo sforzo.':draft.weight===l.weight?'Stesso carico previsto della volta precedente. Valuta tecnica e ripetizioni prima di decidere eventuali aumenti.':'Carico previsto inferiore alla volta precedente. Può essere appropriato in base a recupero, fatica e obiettivo.')+'</div>';}
 }
 h+='<p class="muted tiny" style="line-height:1.65;margin-top:27px">Dati sintetici. L’esperienza definitiva conserverà storico, note e recuperi effettivi senza sovrascrivere il template in automatico.</p>';
 return h;
}
function mainHtml(){
 if(status==="ready")return '<div class="hero">'+heading(mode==="workout"?"WORKOUT SESSION / READY":"STRETCH SESSION / READY",mode==="workout"?"Una scheda completa. Una serie alla volta.":"Mobilità guidata, dall’inizio alla fine.",'Il programma rimane sempre consultabile. Recuperi e consigli sono collegati all’esercizio, non a un timer generico.')+
 '<div class="hero-actions"><button class="btn primary" data-act="start">▶ AVVIA '+(mode==="workout"?"ALLENAMENTO":"ROUTINE")+'</button><span class="tag">'+(mode==="workout"?catalog.length+" esercizi · "+totalSets()+" serie":stretching.length+" esercizi")+'</span></div></div>'+
 '<div class="sectionhead"><h2>Prima di iniziare</h2><span class="tiny muted">Riepilogo completo</span></div><div class="card">'+(mode==="workout"?catalog.map(x=>'<div class="sessionstat"><b>'+esc(x.name)+'</b><span class="muted">'+x.sets+' × '+x.reps+' × '+x.weight+' kg · '+fmt(x.rest)+' rec.</span></div>').join(""):stretching.map(x=>'<div class="sessionstat"><b>'+esc(x.name)+'</b><span class="muted">'+fmt(x.duration)+'</span></div>').join(""))+'</div>';
 if(status==="finished"){const n=mode==="workout"?completedSets():Object.values(stretchDone).filter(Boolean).length;
 const volume=mode==="workout"?Object.values(logs).flat().reduce((sum,x)=>sum+x.weight*x.reps,0):0;
 return '<div class="hero">'+heading("SESSIONE TERMINATA / DEMO","Ottimo lavoro.",'Riepilogo della sessione svolta: la V2 salverà ogni set e la cronologia reale con possibilità di riprendere.')+'<div class="summary-grid"><div><strong>'+n+'</strong><span class="muted tiny">'+(mode==="workout"?"Serie":"Esercizi")+' fatti</span></div><div><strong>'+fmt(elapsed)+'</strong><span class="muted tiny">Durata</span></div><div><strong>'+(mode==="workout"?Math.round(volume)+"kg":Object.keys(stretchDone).length)+'</strong><span class="muted tiny">'+(mode==="workout"?"Volume totale":"Routine completate")+'</span></div></div><div class="hero-actions"><button class="btn primary" data-act="reset">Nuova sessione demo</button></div></div>'+
 '<div class="sectionhead"><h2>Registro della sessione</h2></div><div class="card">'+(mode==="workout"?catalog.map(x=>'<div class="sessionstat"><span>'+esc(x.name)+(skipped[x.id]?' (saltato)':'')+'</span><b>'+(logs[x.id]||[]).length+' / '+x.sets+'</b></div>').join(""):stretching.map(x=>'<div class="sessionstat"><span>'+esc(x.name)+'</span><b>'+(stretchDone[x.id]?'✓':'—')+'</b></div>').join(""))+'</div>';
 }
 const x=current();
 if(mode==="stretch"){
 return '<div class="hero"><div class="label">STRETCHING · '+(index+1)+' / '+stretching.length+'</div><h1 style="margin-top:10px">'+esc(x.name)+'</h1><p>Respira e segui il timer. Il consiglio tecnico resta disponibile a destra.</p></div>'+
 '<div class="sectionhead"><h2>'+(phase==="rest"?"Timer in corso":"Pronto per la routine")+'</h2></div>'+
 (phase==="rest"?timerHtml():'<div class="card" style="text-align:center;padding:30px"><div class="big">'+fmt(x.duration)+'</div><p class="muted small">Tempo previsto</p><div class="buttons" style="margin-top:25px"><button class="btn primary" data-act="stretch-start">▶ INIZIA</button><button class="btn" data-act="stretch-skip">Salta esercizio →</button></div></div>');
 }
 const done=(logs[x.id]||[]).length,steps=x.sets,series=Math.min(steps,done+1);
 return '<div class="hero"><div class="label">ESERCIZIO '+(index+1)+' / '+catalog.length+' · '+esc(x.muscles.join(" · "))+'</div><h1 style="margin-top:10px">'+esc(x.name)+'</h1><p>Serie '+series+' di '+steps+' · Recupero indicato: '+fmt(x.rest)+' · Personalizzabile per esercizio</p></div>'+
 (phase==="rest"?'<div class="sectionhead"><h2>Recupero dopo la serie '+done+'</h2><span class="tag active">Auto timer '+fmt(x.rest)+'</span></div>'+timerHtml():'<div class="sectionhead"><h2>Serie '+series+' / '+steps+'</h2><span class="tag active">Peso e ripetizioni effettive</span></div>'+
 '<div class="card" style="padding:29px"><div class="details"><div class="detailbox"><div class="label">CARICO</div><div class="counter"><button data-act="weight-" aria-label="Riduci carico">−</button><strong>'+draft.weight+' kg</strong><button data-act="weight+" aria-label="Aumenta carico">+</button></div></div><div class="detailbox"><div class="label">RIPETIZIONI</div><div class="counter"><button data-act="reps-" aria-label="Riduci ripetizioni">−</button><strong>'+draft.reps+'</strong><button data-act="reps+" aria-label="Aumenta ripetizioni">+</button></div></div></div><div class="buttons" style="margin-top:26px"><button class="btn primary" data-act="complete">✓ '+(done===steps-1?'FINISCI ESERCIZIO':'SERIE COMPLETATA')+'</button><button class="btn" data-act="skip-ex">Salta esercizio →</button></div></div>')+
 (lastUndo?'<div class="buttons" style="justify-content:flex-start;margin-top:13px"><button class="btn small" data-act="undo">↶ Annulla ultima serie</button></div>':'');
}
function timerHtml(){const pct=restLength?Math.max(0,remaining/restLength*100):0;return '<div class="card"><div class="timer"><div class="timer-circle" id="time-circle" style="--pct:'+pct+'%"><div class="clock"><div id="time-display">'+fmt(remaining)+'</div><small>'+((mode==="workout")?"RECUPERO":"DURATA ESERCIZIO")+'</small></div></div></div><div class="buttons"><button class="btn" data-act="rest-15">−15s</button><button class="btn" data-act="pause">'+(paused?'▶ Riprendi':'Ⅱ Pausa')+'</button><button class="btn" data-act="rest+15">+15s</button></div><div class="buttons" style="margin-top:12px"><button class="btn small secondary" data-act="skip-rest">'+(mode==="workout"?"Salta recupero →":"✓ Fatto in anticipo →")+'</button></div></div>'}
function render(){const program=programHtml();$("#program-sidebar").innerHTML=program;$("#program-mobile").innerHTML=program;$("#main").innerHTML=mainHtml();$("#insights").innerHTML=showRight();$("#switch-mode").textContent=mode==="workout"?"⇄ Stretching":"⇄ Allenamento";$("#switch-theme").textContent=theme==="dark"?"☼ Giorno":"☾ Notte"}
function action(a){
 if(a==="start")start();
 else if(a==="reset")reset();
 else if(a==="complete")logSet();
 else if(a==="skip-ex")skipEx();
 else if(a==="undo")undoSet();
 else if(a==="weight+"||a==="weight-"){draft.weight=Math.max(0,Math.round((draft.weight+(a==="weight+"?2.5:-2.5))*10)/10);render()}
 else if(a==="reps+"||a==="reps-"){draft.reps=Math.max(0,draft.reps+(a==="reps+"?1:-1));render()}
 else if(a==="pause")pause();
 else if(a==="rest+15"||a==="rest-15")adjustRest(a==="rest+15"?15:-15);
 else if(a==="skip-rest"){mode==="workout"?(stopTicker(),completeRest()):completeStretch()}
 else if(a==="stretch-start")startStretchTimer();
 else if(a==="stretch-skip")skipStretch();
}
document.addEventListener("click",e=>{const act=e.target.closest("[data-act]");if(act){action(act.dataset.act);return}const sel=e.target.closest("[data-select]");if(sel&&status==="running"&&mode==="workout"){const next=Number(sel.dataset.select);if(next!==index){if(phase==="rest"){showToast("Termina o salta il recupero prima di cambiare esercizio.");return}enterIndex(next)}return}});
$("#switch-mode").addEventListener("click",()=>{mode=mode==="workout"?"stretch":"workout";reset()});
$("#switch-theme").addEventListener("click",()=>{theme=theme==="dark"?"light":"dark";document.body.dataset.theme=theme;render()});
$("#reset").addEventListener("click",()=>{$("#dialog-content").innerHTML='<h2 id="dlg-heading">Reimpostare la demo?</h2><p class="small muted" style="margin-top:14px;line-height:1.7">Tutti i set completati in questa sessione dimostrativa saranno persi. Nessun dato reale è mai stato scritto.</p><div class="buttons" style="margin-top:25px"><button class="btn" id="cancel-reset">Annulla</button><button class="btn danger" id="accept-reset">Reset demo</button></div>';$("#confirmation").showModal();$("#cancel-reset").onclick=()=>$("#confirmation").close();$("#accept-reset").onclick=()=>{$("#confirmation").close();reset()}});
reset();
</script></body></html>
