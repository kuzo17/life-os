name: App quality (visual lab)

on:
  push:
    branches: [lifeos-visual-lab]
    paths: ['app/**', '.github/workflows/app-quality.yml']
  pull_request:
    branches: [lifeos-visual-lab]
    paths: ['app/**', '.github/workflows/app-quality.yml']

permissions:
  contents: read

concurrency:
  group: app-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:e2e:install --with-deps
      - run: pnpm verify
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - run: pnpm test:emulator:install
      - run: pnpm test:emulator
      - name: Report sintetici in caso di fallimento
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: app-quality-${{ github.run_id }}
          path: |
            app/playwright-report/
            app/test-results/
          if-no-files-found: ignore
          retention-days: 7
